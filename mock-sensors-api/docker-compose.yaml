# =============================================================================
# K-HEALTHinAIR Mock Sensor APIs — Docker Compose (standalone)
# =============================================================================
# Mock for Inbiot, Qlair & Kunak APIs.
# Runs independently from AQDR — start/stop without affecting the platform.
#
# Usage:
#   docker-compose up -d          # start mock
#   docker-compose down            # stop mock
#
# Then update AQDR .env to point to http://mock-sensor-apis:8888
# =============================================================================

services:
  mock-sensor-apis:
    build: .
    container_name: mock-sensor-apis
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      MOCK_NUM_READINGS: ${MOCK_NUM_READINGS}
      MOCK_INTERVAL_MIN: ${MOCK_INTERVAL_MIN}
      MOCK_PORT: ${MOCK_PORT}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - khealthinair-net

networks:
  khealthinair-net:
    external: false
    name: khealthinair-net
