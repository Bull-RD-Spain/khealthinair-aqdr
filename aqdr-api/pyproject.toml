[tool.poetry]
name = "aqdr-api"
version = "2.0.0"
description = "API subcomponent of the Air Quality Data Repository (AQDR)"
authors = [
    "Alberto Acebes <alberto.acebes@eviden.net>",
    "Roberto Hernandez <roberto.hernandezr@atos.net>",
]
maintainers = ["Alberto Acebes <alberto.acebes@eviden.net>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.5"
uvicorn = "^0.32.1"
pandas = "^2.2.2"
pyarrow = "18.1.0"
openpyxl = "^3.1.2"
python-multipart = "^0.0.19"
python-jose = { extras = ["cryptography", "jwt"], version = "^3.3.0" }
passlib = "^1.7.4"
psycopg = "^3.1.18"
psycopg-binary = "^3.1.18"
influxdb-client = { version = "^1.47.0", extras = [
    "async",
    "aiohttp",
    "aiocsv",
] }
bcrypt = "^4.1.3"
debugpy = "^1.8.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "6.0.0"
pytest-env = "^1.1.3"

[tool.poetry.group.test.dependencies]
pytest = "^8.1.1"
pytest-cov = "6.0.0"
pytest-env = "^1.1.3"
influxdb-client = "^1.41.0"

[tool.black]
line-length = 79
