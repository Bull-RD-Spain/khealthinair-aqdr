[tool.poetry]
name = "aqdr-ingestor"
version = "2.0.0"
description = "Ingestor subcomponent of the Air Quality Data Repository (AQDR)"
authors = [
    "Alberto Acebes <alberto.acebes@eviden.net>",
    "Roberto Hernandez <roberto.hernandezr@atos.net>",
]
maintainers = ["Alberto Acebes <alberto.acebes@eviden.net>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.5"
uvicorn = "^0.32.1"
pandas = "^2.2.2"
pyarrow = "^18.1.0"
openpyxl = "^3.1.2"
requests = "^2.29.0"
schedule = "^1.2.0"
pq = "1.9.1"
psycopg = "^3.1.18"
psycopg-binary = "^3.1.18"
psycopg-pool = "^3.1.18"
influxdb-client = { version = "^1.47.0", extras = [
    "async",
    "aiohttp",
    "aiocsv",
] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "6.0.0"
pytest-env = "^1.1.3"

[tool.poetry.group.test.dependencies]
pytest = "^8.1.1"
pytest-cov = "6.0.0"
pytest-env = "^1.1.3"

[tool.poetry.scripts]
aqdr-ingestor = "aqdr-ingestor.aqdr-ingestor:run"

[tool.black]
line-length = 79
