apiVersion: 1
providers:
  - name: "default"
    folder: "" # 'General' This is a reserved name and cannot be used for a folder.
    type: file
    disableDeletion: true
    editable: true # Change once is decided is mature enough to avoid later edition not backed up in provisioning
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/default
