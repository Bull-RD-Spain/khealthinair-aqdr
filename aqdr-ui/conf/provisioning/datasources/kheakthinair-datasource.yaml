apiVersion: 1
# https://grafana.com/docs/grafana/latest/datasources
datasources:
  - id: 1
    uid: "aqdr-ts-db-flux"
    name: "aqdr-ts-db-flux"
    type: "influxdb"
    url: ${KHIA_DSOURCE_URL}
    access: "proxy"
    isDefault: true
    basicAuth: true
    user: ${KHIA_DSOURCE_AUTH_USER}
    basicAuthUser: ${KHIA_DSOURCE_AUTH_USER}
    jsonData:
      version: Flux
      defaultBucket: "AIR_QUALITY"
      organization: "K-HEALTHinAIR"
      tlsSkipVerify: true
      oauthPassThru: true
      disableCompression: true
    secureJsonData:
      token: "${KHIA_DSOURCE_AUTH_TOKEN}"
      basicAuthPassword: "${KHIA_DSOURCE_AUTH_PASSWORD}"
    editable: false

  - id: 2
    uid: "aqdr-ts-db-influxql"
    name: "aqdr-ts-db-influxql"
    type: "influxdb"
    url: ${KHIA_DSOURCE_URL}
    access: "proxy"
    isDefault: false
    jsonData:
      version: InfluxQL
      organization: "K-HEALTHinAIR"
      tlsSkipVerify: true
      dbName: AIR_QUALITY
      httpHeaderName1: "Authorization"
    secureJsonData:
      httpHeaderValue1: "Token ${KHIA_DSOURCE_AUTH_TOKEN}"
    editable: false

  - id: 3
    uid: "aqdr-platform-db"
    name: "aqdr-platform-db"
    type: "postgres"
    url: ${SENSORS_DB_HOST}
    user: ${SENSORS_DB_USER}
    jsonData:
      database: ${SENSORS_DB_TABLE}
      sslmode: "disable"
      maxOpenConns: 100
      maxIdleConns: 100
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: "${SENSORS_DB_PASSWORD}"
    editable: false
